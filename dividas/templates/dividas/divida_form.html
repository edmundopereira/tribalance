{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Nova Dívida</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{% url 'dividas:divida_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
